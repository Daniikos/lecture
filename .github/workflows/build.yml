# Сборка всех лекций в PDF.
#
# - на каждый PR: собирает — это проверка, что правка не сломала компиляцию;
#   PDF доступны как артефакт запуска (вкладка Actions → запуск → Artifacts).
# - на push в main: дополнительно обновляет релиз с тегом `latest`,
#   откуда читатели забирают актуальные PDF без установки TeX:
#   https://github.com/Daniikos/lecture/releases/tag/latest
#
# Каждый .tex в репозитории считается самостоятельным документом.
# Если появятся общие файлы (preamble.tex, стили), которые подключаются
# через \input и сами не компилируются, — исключить их из root_file.

name: build

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.sty"
      - "**.cls"
      - "assets/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.tex"
      - "**.sty"
      - "**.cls"
      - "assets/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile all lectures
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true
          # pdflatex по умолчанию; -halt-on-error, чтобы ошибка валила сборку,
          # а не пряталась в логе.
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Collect PDFs
        # Имя PDF в релизе = <курс>-<дата>.pdf, чтобы лекции разных курсов
        # с одной датой не перезаписывали друг друга.
        run: |
          mkdir -p release
          find . -path ./release -prune -o -name '*.pdf' -print | while read -r f; do
            course=$(basename "$(dirname "$f")")
            cp "$f" "release/${course}-$(basename "$f")"
          done
          ls -l release

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: release/*.pdf
          if-no-files-found: error

      - name: Move `latest` tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish PDFs to `latest` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Актуальные PDF
          body: |
            Автоматическая сборка с ветки `main`, коммит ${{ github.sha }}.
            Пересобирается при каждом изменении лекций.
          prerelease: true
          files: release/*.pdf
